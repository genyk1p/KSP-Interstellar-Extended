// Fork: wear of beam emitters (FNPlugin/Beamedpower/BeamGeneratorWear.cs).
// ratedLifetimeHours: hours at full power until the conversion efficiency has dropped by 20 %.
// Hotter vessels (waste heat bar) wear faster; an engineer on EVA replaces the emitters.

// Laser diode bars: ~10 000-20 000 h to -20 % output at rated power and temperature.
@PART[*]:HAS[@MODULE[BeamGeneratorModule]:HAS[#beamTypeName[DiodeLaser]]]:FOR[WarpPlugin]
{
	@MODULE[BeamGeneratorModule] { %ratedLifetimeHours = 15000 }
}
@PART[*]:HAS[@MODULE[IntegratedBeamGenerator]:HAS[#beamTypeName[DiodeLaser]]]:FOR[WarpPlugin]
{
	@MODULE[IntegratedBeamGenerator] { %ratedLifetimeHours = 15000 }
}

// Free electron laser: accelerator with a photocathode gun and klystrons, parts replaced every few years of running.
@PART[*]:HAS[@MODULE[BeamGeneratorModule]:HAS[#beamTypeName[Free?Electron?Laser]]]:FOR[WarpPlugin]
{
	@MODULE[BeamGeneratorModule] { %ratedLifetimeHours = 30000 }
}
@PART[*]:HAS[@MODULE[IntegratedBeamGenerator]:HAS[#beamTypeName[Free?Electron?Laser]]]:FOR[WarpPlugin]
{
	@MODULE[IntegratedBeamGenerator] { %ratedLifetimeHours = 30000 }
}

// Gyrotron: vacuum tube, the cathode wears out.
@PART[*]:HAS[@MODULE[BeamGeneratorModule]:HAS[#beamTypeName[Gyrotron]]]:FOR[WarpPlugin]
{
	@MODULE[BeamGeneratorModule] { %ratedLifetimeHours = 20000 }
}

// Microwave phased arrays: solid state amplifiers, very long life.
@PART[*]:HAS[@MODULE[IntegratedBeamGenerator]:HAS[#beamTypeName[Microwave*]]]:FOR[WarpPlugin]
{
	@MODULE[IntegratedBeamGenerator] { %ratedLifetimeHours = 100000 }
}

// Kerbalism: random failures of the generator. A failure disables the module and the transmitter stops the beam;
// an engineer repairs it. "High quality" also doubles the emitter life (qualityLifeMultiplier).
@PART[*]:HAS[@MODULE[BeamGeneratorModule]]:NEEDS[FeatureReliability]:AFTER[zzzKerbalismDefault]
{
	MODULE
	{
		name = Reliability
		type = BeamGeneratorModule
		title = #LOC_KSPIE_BeamGenerator_ReliabilityTitle
		redundancy = Beamed Power
		repair = Engineer
		mtbf = 72576000
		extra_cost = 1.0
		extra_mass = 0.1
		rated_radiation = 0.5
		radiation_decay_rate = 2
	}
}
@PART[*]:HAS[@MODULE[IntegratedBeamGenerator]]:NEEDS[FeatureReliability]:AFTER[zzzKerbalismDefault]
{
	MODULE
	{
		name = Reliability
		type = IntegratedBeamGenerator
		title = #LOC_KSPIE_BeamGenerator_ReliabilityTitle
		redundancy = Beamed Power
		repair = Engineer
		mtbf = 72576000
		extra_cost = 1.0
		extra_mass = 0.1
		rated_radiation = 0.5
		radiation_decay_rate = 2
	}
}

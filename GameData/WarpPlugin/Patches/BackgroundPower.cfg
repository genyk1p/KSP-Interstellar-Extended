// Background (rails warp) power of KSPIE reactors with Kerbalism - fork addition, see FORK.md.
// Kerbalism calls InterstellarBackgroundPower.BackgroundUpdate for every UNLOADED vessel in its background step:
// the module runs the vessel's reactors, generators and radiators at their steady operating point (fuel burnt,
// ElectricCharge made, products) instead of nothing until the vessel is loaded again. The values it uses are
// written by the reactor, generator and radiator modules into the save (keys bg*).
// One patch per reactor module name (every class deriving from InterstellarReactor used on a part).

@PART[*]:HAS[@MODULE[FNAntimatterReactor],!MODULE[InterstellarBackgroundPower]]:NEEDS[Kerbalism]:FOR[WarpPlugin]
{
	MODULE
	{
		name = InterstellarBackgroundPower
	}
}

@PART[*]:HAS[@MODULE[FNParticleAccelerator],!MODULE[InterstellarBackgroundPower]]:NEEDS[Kerbalism]:FOR[WarpPlugin]
{
	MODULE
	{
		name = InterstellarBackgroundPower
	}
}


// Generated by tools/cooling/cc_cryostat_rates.py (main repo) from ModuleManager.ConfigCache — do not edit by hand.
// Cryostat boiloff by the player's rule (todo/cooling-unification.md, step 4): without cooling a tank loses
// boiloffPercentPerHour % of what it holds per hour; cooling costs 1.4 x that x amount / 1000 EC/s (FNModuleCryostat).
// Rates: insulation class x size x fuel (heat inflow, latent heat); non-cryogenic resources 0 (no loss, no cooling).
// :FINAL, and this file must sort after InterstellarFuelSwitch/: its IntegrationLiquidFuel*.cfg add cryostats to
// stock and other tanks on :FINAL too (MM applies a pass in file path order).
// Every patch :NEEDS[CryoCooling]: the rule is one part of the build's single cooling system (the CryoCooling mod
// does the other tanks and the low-battery guard); without CryoCooling the cryostats keep the upstream model.

// New tanks: cooling off (player's decision 4). Vessels in flight keep their saved state.
@PART[*]:HAS[@MODULE[ModuleStorageCryostat]]:NEEDS[CryoCooling]:FINAL
{
	@MODULE[ModuleStorageCryostat],* { %isDisabled = True }
}
@PART[*]:HAS[@MODULE[FNModuleCryostat]]:NEEDS[CryoCooling]:FINAL
{
	@MODULE[FNModuleCryostat],* { %isDisabled = True }
}

// CryoCooling's guard (cooling off at a low battery, back on when charged) on every cryostat part; here and not in
// CryoCooling's own patches because those run before IFS's :FINAL cryostats exist.
@PART[*]:HAS[@MODULE[ModuleStorageCryostat],!MODULE[CryoPowerGuard]]:NEEDS[CryoCooling]:FINAL
{
	MODULE { name = CryoPowerGuard }
}
@PART[*]:HAS[@MODULE[FNModuleCryostat],!MODULE[CryoPowerGuard]]:NEEDS[CryoCooling]:FINAL
{
	MODULE { name = CryoPowerGuard }
}

